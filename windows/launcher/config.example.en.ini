; ===========================================================================
;  Traiectus launcher configuration - TEMPLATE
;
;  * This is a template, not a real config. To use it:
;      copy config.example.en.ini config.ini
;    then adjust the values below for this machine.
;
;    config.ini itself is NOT tracked by git (.gitignore excludes it) -
;    it holds this machine's pairing token.
;
;  This file works in both layouts (the launcher finds it by itself):
;    * development:  ...\launcher\
;    * installed:    %LOCALAPPDATA%\Traiectus\   (all files flat in one folder)
; ===========================================================================

[ui]
; UI language: zh | en. Leave empty = follow the Windows UI language.
language=

[server]
; Server executable name. If it is not next to this file, the launcher also
; tries ..\phase3-tcp\build\ and ..\
exe=Traiectus-Server.exe

; Server command line.
;   --device  Mouse device filter. Empty by default = no filter (all mouse-class
;             input is forwarded). The first run detects the mouse you are really
;             using and writes it back here. On a laptop (trackpad + mouse) the
;             automatic detection may give up - use the tray menu:
;             right-click -> "Detect mouse" and pick one.
;             To set it by hand: run Traiectus-Server.exe --list and copy the
;             VID_xxxx&PID_xxxx[&MI_xx] from the Mouse line (quote it: it has &).
;
;   * No token here: the --token option was removed (2026-10-01). The token is
;     created by the pairing flow: the first time a Mac connects, a dialog
;     appears on Windows - click "Allow"; Windows generates the token and stores
;     it in ..\phase3-tcp\paired.json, and the Mac remembers it. No typing on
;     either side. New machine / lost token: tray right-click -> "Re-pair".
;
;   --hotkey  Mouse-switch hotkey. Syntax: modifiers joined with +, last part is
;             the main key. Examples: Ctrl+Alt+M (default) / Ctrl+Shift+M /
;             Win+Alt+K / F1-F24 as the main key. `off` = no hotkey. At least one
;             modifier is required; a bare key is rejected.
;             ! A successful registration reserves that combination system-wide -
;               no other program can use it.
;             You can also change it from the tray (right-click -> "Set
;             mouse-switch hotkey..."); the launcher writes the value back here.
args=--hotkey Ctrl+Alt+M

; Server output goes here (relative to the launcher's folder). Truncated on every start.
log=Traiectus-Server.log

[bridge]
; * Since 2026-10-01 (3b) this section is empty by default = the bridge does not
;   start: reading the keyboard receiver frames moved into the server, so the
;   PowerShell bridge is no longer needed. Fill it in only for A/B testing
;   (see launcher\说明.en.md):
cmd=

; The launcher redirects the bridge's stdout/stderr here. Deliberately a
; different file from the -OutFile above: two writers on one file would
; overwrite each other. Mostly useful for catching "PowerShell failed to start".
log=TraiectusBridge-console.log

[app]
; Server TCP port (must match the Mac client)
port=45789

; How long to wait before calling it "server start timed out" (milliseconds)
waitMs=15000
