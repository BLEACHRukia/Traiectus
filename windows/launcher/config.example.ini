; ===========================================================================
;  Traiectus 统一入口配置 —— 模板
;
;  ★ 这是模板，不是真配置。用的时候：
;       copy config.example.ini config.ini
;    然后把下面的口令、Mac 地址改成你自己的值。
;
;    config.ini 本身**不入库**（.gitignore 里已排除）—— 它装的是本机口令。
;
;  这份文件在两种布局下都能直接用（程序会自己找文件）：
;    · 开发目录  ...\launcher\
;    · 安装目录  %LOCALAPPDATA%\Traiectus\   （所有文件平铺在同一层）
; ===========================================================================

[server]
; 服务端程序名。同目录找不到时，会依次尝试 ..\phase3-tcp\build\ 和 ..\
exe=Traiectus-Server.exe

; 服务端启动参数。
;   --device  鼠标设备过滤。**默认留空 = 不挑设备**（转发所有鼠标类输入）；
;             第一次运行服务端会自动识别"你真正在用的那只鼠标"并写回这里。
;             笔记本用户（触控板 + 鼠标）自动识别判不出来时，
;             点托盘右键 →「检测鼠标…」从候选里点一个。
;             想手动指定：跑 Traiectus-Server.exe --list，把 Mouse 那行的
;             VID_xxxx&PID_xxxx[&MI_xx] 抄进来（有 & 必须加引号）。
;
;   ★ 口令不用写在这里：--token 参数已经删掉了（2026-10-01）。
;     口令由「配对流程」生成：
;     具体：Mac 第一次连过来时，Windows 上会弹一个确认框，点「允许」，
;           口令由 Windows 随机生成、存进 ..\phase3-tcp\paired.json，
;           Mac 自己把它记住 —— 两台机器都不用打字。
;     换设备 / Mac 丢了口令：托盘右键 →「重新配对」。
;
;   --hotkey  鼠标切换快捷键。语法：修饰键用 + 连接，最后一个是主键。
;             例：Ctrl+Alt+M（默认） / Ctrl+Shift+M / Win+Alt+K / F1–F24 作主键
;             写 off = 不注册热键。至少要有 1 个修饰键，裸键会被拒绝。
;             ⚠ 注册成功 = 这个组合键在全系统被 Traiectus 独占，别的程序拿不到。
;             也可以直接右键托盘 →「设置鼠标切换快捷键…」改，它会自己写回这一行。
args=--hotkey Ctrl+Alt+M

; 服务端输出写到这里（相对入口程序所在目录）。每次启动会截断重开。
log=Traiectus-Server.log

[bridge]
; ★ 2026-10-01（3b）起，这一段**默认留空 = 不启动桥接** ——
;   键盘状态帧的读取已经并进服务端，PowerShell 桥接不再需要。
;   只在做对照测试时才填（填法见 launcher\说明.md）：
cmd=

; 入口把桥接进程的标准输出/错误重定向到这里。
; 刻意和上面那个 -OutFile 用两个不同文件：否则两个写入者会抢同一个文件，
; 内容互相覆盖。这个文件主要用来抓"PowerShell 启动失败"这类问题。
log=TraiectusBridge-console.log

[app]
; 服务端 TCP 端口（必须和 Mac 客户端填的一致）
port=45789

; 等多久算"服务端启动超时"（毫秒）
waitMs=15000
